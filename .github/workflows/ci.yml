name: CI

on:
  pull_request:
    branches: [main]
  # Push to main is kept so every main commit has a standalone CI status;
  # release.yml also calls this workflow to gate publishing (a second run).
  push:
    branches: [main]
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Install tmux (required by src/infrastructure/tmux tests)
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome lint & format check
        run: bun run lint:ci

      - name: TypeScript typecheck
        run: bun run typecheck

      - name: Tests
        run: bun test

  # The sandbox isolation test needs a Docker daemon and the image; the `check`
  # job skips it (with a logged reason), so run it for real here.
  sandbox-isolation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the sandbox image
        run: docker build -t ml-ralph-sandbox:1 src/infrastructure/ralph/sandbox

      - name: Sandbox isolation tests (real Docker)
        run: bun test src/infrastructure/ralph/sandbox.test.ts
